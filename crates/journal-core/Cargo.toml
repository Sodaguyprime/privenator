[package]
name = "journal-core"
description = "Platform-neutral core of the voice journal: crypto, storage, audio, transcription. No Tauri or UI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true

# Crypto crates are pinned to the rand_core 0.6 / generic-array generation so
# they interoperate; upgrade them together (docs/DECISIONS.md).
[dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
cpal = "0.18"
getrandom = "0.2"
hkdf = "0.12"
ogg = "0.9"
opus = "0.4"
rubato = "5"
rusqlite = { version = "0.40", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
whisper-rs = { version = "0.16", features = ["log_backend"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }
zxcvbn = "3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ErrorReporting", "Win32_System_Diagnostics_Debug"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
